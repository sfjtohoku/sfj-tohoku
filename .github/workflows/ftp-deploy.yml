name: Deploy to FTP

on:
  # GitHubのmainブランチにコードがPushされた時に作動します
  push:
    branches:
      - main
  # microCMSで記事を更新・削除した時（Webhook）に作動します
  repository_dispatch:
    types: [microcms-update]

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      # ここでmicroCMSから最新のデータを引っ張ってきてサイトを組み立てます
      env:
        MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
        MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
      run: npm run build

    - name: Sync files via FTP
      # 組み立てた完成品（distフォルダの中身）を学会のFTPサーバーへ転送します
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # 学会指定のアップロード先フォルダ（ドキュメントルート）
        server-dir: /www/tohoku.sfj.or.jp/html/
        # Astroが書き出した完成品の入っているフォルダ
        local-dir: ./dist/
        
